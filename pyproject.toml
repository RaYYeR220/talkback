[project]
name = "talkback"
version = "0.1.0"
description = "Editorial gallery for a full football matchday: stories, evidence and per-territory clearance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-framework-ag-ui>=1.7.0",
    "agent-framework-core==1.23.0",
    "agent-framework-foundry>=1.15.0",
    "agent-framework-openai>=1.17.0",
    "agent-framework-orchestrations>=1.4.0",
    "azure-ai-contentsafety>=1.0.0",
    "azure-identity>=1.27.0",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.scripts]
talkback = "talkback.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running calibration and integration tests"]
addopts = "-m 'not slow' --import-mode=importlib"

[project]
name = "talkback"
version = "0.1.0"
description = "Editorial gallery for a full football matchday: stories, evidence and per-territory clearance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.scripts]
talkback = "talkback.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running calibration and integration tests"]
addopts = "-m 'not slow' --import-mode=importlib"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talkback OGraf Renderer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .layer > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    body.bg-grey #stage { background: linear-gradient(160deg, #3b4048, #15171b); }
    body.bg-checker #stage { background: repeating-conic-gradient(#2a2d33 0 25%, #1d1f24 0 50%) 0 0 / 48px 48px; }
    body.bg-pitch #stage {
      background:
        linear-gradient(90deg, transparent 49.9%, rgba(255, 255, 255, 0.5) 49.9% 50.1%, transparent 50.1%),
        radial-gradient(circle at 50% 50%, transparent 0 129px, rgba(255, 255, 255, 0.5) 130px 132px, transparent 133px),
        repeating-linear-gradient(90deg, #2f6b3a 0 160px, #2a6234 160px 320px);
    }
    #badge {
      position: fixed; top: 12px; right: 12px; z-index: 9999; display: none; padding: 6px 10px;
      font: 600 13px/1.2 system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 3px;
    }
    body.debug #badge, #badge.identify { display: block; }
    #badge.identify { font-size: 48px; padding: 18px 28px; top: 50%; right: 50%; transform: translate(50%, -50%); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="badge"></div>
  <script type="module" src="./renderer.mjs"></script>
</body>
</html>

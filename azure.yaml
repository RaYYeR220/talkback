# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# azd project for Talkback. `azd up` = provision infra/ (Bicep) + deploy:
#   - containerapp services: image built in ACR (remote build), swapped into the app/job
#   - azure.ai.agent services: image built in ACR, new hosted-agent version, A2A endpoint + card
# Deploy order follows `uses`; the agents depend on nothing azd manages here
# because Bicep owns the Foundry project (FOUNDRY_PROJECT_ENDPOINT, AZURE_AI_PROJECT_ID).

name: talkback

requiredVersions:
  azd: ">=1.37.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.22"

infra:
  provider: bicep
  path: infra
  module: main

services:
  talkback:
    host: containerapp
    language: docker
    project: .
    docker:
      path: docker/talkback.Dockerfile
      context: .
      remoteBuild: true

  generator:
    host: containerapp
    language: docker
    project: .
    docker:
      path: docker/generator.Dockerfile
      context: .
      remoteBuild: true

  mcp:
    host: containerapp
    language: docker
    project: .
    docker:
      path: docker/mcp.Dockerfile
      context: .
      remoteBuild: true

  web:
    host: containerapp
    language: docker
    project: .
    docker:
      path: docker/web.Dockerfile
      context: .
      remoteBuild: true
      buildArgs:
        - NEXT_PUBLIC_TALKBACK_API_URL=${TALKBACK_URL}

  # Foundry hosted agents. Names must match ARCHIVIST_AGENT_NAME / LAB_AGENT_NAME
  # (Bicep defaults), which the talkback service uses to build the A2A URLs.
  archivist:
    host: azure.ai.agent
    language: docker
    project: agents/archivist
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    kind: hosted
    name: talkback-archivist
    description: Story hunter. Picks the season storylines a match moment makes worth saying now.
    startupCommand: python main.py
    protocols:
      - protocol: responses
        version: 2.0.0
    agentEndpoint:
      protocols:
        - responses
        - a2a
      authorizationSchemes:
        - type: Entra
    agentCard:
      description: Story hunter for a football matchday. Given a match moment and its story board, picks the season storylines worth saying now and why now.
      version: "1.0"
      skills:
        - id: storyline-pick
          name: Pick due storylines
          description: Chooses which season storylines (milestones, farewells, debuts, reunions, races, relegation stakes) a moment makes worth saying, using only storyline ids from the board. Answers JSON {storylines [{storyline_id, why_now}]}.
          tags:
            - football
            - storylines
            - broadcast
    env:
      PYTHONNOUSERSITE: "1"
      TALKBACK_LLM: foundry
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_STRONG}
      AZURE_AI_MODEL_DEPLOYMENT_NAME_FAST: ${FOUNDRY_MODEL_FAST}
      STORAGE_ACCOUNT_URL: ${STORAGE_ACCOUNT_URL}
    # Each call without a session/conversation gets its own sandbox; a short
    # idle timeout caps what a stray sandbox costs (default is 900 s).
    sessionConfiguration:
      idleTimeoutSeconds: 120
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

  lab:
    host: azure.ai.agent
    language: docker
    project: agents/lab
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    kind: hosted
    name: talkback-lab
    description: Evidence supplier. Replays a moment in the simulator with one thing changed and reports the effect with a 95% interval.
    startupCommand: python main.py
    protocols:
      - protocol: responses
        version: 2.0.0
    agentEndpoint:
      protocols:
        - responses
        - a2a
      authorizationSchemes:
        - type: Entra
    agentCard:
      description: Evidence supplier for causal claims. Replays a match moment in the simulator with one thing changed and reports the effect with a 95% interval.
      version: "1.0"
      skills:
        - id: counterfactual
          name: Counterfactual replay
          description: Runs typed interventions (flip an event, shift a position, keep the press or line) over batched rollouts. A causal claim is supported only when the 95% interval of the paired effect excludes zero. Answers JSON {experiments, conclusion, supported}.
          tags:
            - football
            - simulation
            - causal
    env:
      PYTHONNOUSERSITE: "1"
      TALKBACK_LLM: foundry
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_STRONG}
      AZURE_AI_MODEL_DEPLOYMENT_NAME_FAST: ${FOUNDRY_MODEL_FAST}
      STORAGE_ACCOUNT_URL: ${STORAGE_ACCOUNT_URL}
      STORAGE_CONTAINER_SNAPSHOTS: snapshots
    sessionConfiguration:
      idleTimeoutSeconds: 120
    container:
      resources:
        cpu: "2.0"
        memory: 4Gi
